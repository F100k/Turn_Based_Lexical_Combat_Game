<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lexical Combat Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a12;--surface:#131320;--surface2:#1a1a2e;--border:#252540;
  --accent:#7c5cbf;--gold:#e8b84b;--text:#e8e6f8;--sub:#8886aa;
  --player:#5ba4f5;--enemy:#f06b6b;--green:#52d68a;
}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:'Outfit',system-ui,sans-serif;font-size:15px;line-height:1.6;
  min-height:100vh;overflow-x:hidden;
  background-image:
    radial-gradient(ellipse 60% 40% at 20% 80%, rgba(124,92,191,0.07) 0%, transparent 70%),
    radial-gradient(ellipse 50% 35% at 80% 20%, rgba(91,164,245,0.05) 0%, transparent 70%);
}

/* ── NAV ── */
nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 2rem;height:54px;
  background:rgba(19,19,32,0.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:100;
}
.nav-brand{
  font-family:'Cinzel',serif;font-size:1.05rem;font-weight:700;letter-spacing:0.1em;
  background:linear-gradient(120deg,var(--gold),#c084fc);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  text-decoration:none;
}
.nav-links{display:flex;gap:0.5rem;align-items:center}
.nav-btn{
  font-family:'Outfit',sans-serif;font-size:0.8rem;font-weight:600;
  padding:0.35rem 0.9rem;border-radius:6px;cursor:pointer;
  text-decoration:none;transition:all 0.18s;border:1px solid var(--border);
  background:transparent;color:var(--sub);
  display:inline-flex;align-items:center;gap:0.3em;
}
.nav-btn:hover{border-color:var(--accent);color:var(--text)}
.nav-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ── NAV NAME WIDGET ── */
.nav-name-widget{
  display:flex;align-items:center;gap:0.35rem;
}
.nav-name-icon{
  color:var(--sub);flex-shrink:0;
  display:flex;align-items:center;
}
.nav-name-input{
  background:transparent;border:none;border-bottom:1px solid var(--border);outline:none;
  color:var(--text);font-family:'Outfit',sans-serif;font-size:0.85rem;font-weight:600;
  width:110px;padding:0.1rem 0.15rem;
  transition:border-color 0.2s;
}
.nav-name-input:focus{border-bottom-color:var(--accent)}
.nav-name-input::placeholder{color:var(--sub)}
.nav-random-btn{
  background:transparent;border:none;border-radius:5px;
  color:var(--sub);padding:0.15rem 0.3rem;cursor:pointer;
  transition:all 0.18s;line-height:1;display:flex;align-items:center;
}
.nav-random-btn:hover{color:var(--gold);background:rgba(232,184,75,0.1)}

/* ── FULL-WIDTH LAYOUT ── */
.page{
  width:100%;max-width:1400px;margin:0 auto;
  padding:1.25rem 2rem 3rem;
  display:flex;flex-direction:column;gap:1.1rem;
}

/* ── SETUP BAR ── */
.setup-bar{
  display:flex;gap:0.75rem;align-items:flex-end;
  padding:0.5rem 0;
}
.setup-bar .field{display:flex;flex-direction:column;gap:0.3rem;flex:1}
.setup-bar label{font-size:0.68rem;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;color:var(--sub)}
input[type="text"]{
  background:var(--surface2);border:1px solid var(--border);border-radius:6px;
  color:var(--text);padding:0.5rem 0.85rem;font-family:'Outfit',sans-serif;font-size:0.9rem;
  outline:none;transition:border-color 0.2s;width:100%;
}
input[type="text"]:focus{border-color:var(--accent)}
.btn{font-family:'Outfit',sans-serif;font-size:0.875rem;font-weight:600;border:none;border-radius:8px;padding:0.5rem 1.2rem;cursor:pointer;transition:all 0.18s;white-space:nowrap}
.btn-ghost{background:transparent;color:var(--sub);border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--accent);color:var(--text)}
.btn-primary{background:var(--accent);color:#fff;width:100%;padding:0.75rem;font-size:0.95rem}
.btn-primary:hover:not(:disabled){background:#9d82e0;box-shadow:0 0 24px rgba(124,92,191,0.5)}
.btn-primary:disabled{opacity:0.35;cursor:not-allowed}

/* ── BATTLE STAGE ── */
.battle-stage{
  border-radius:18px;
  padding:2rem 2.5rem 1.75rem;
  display:grid;grid-template-columns:1fr 100px 1fr;gap:1.5rem;align-items:center;
  position:relative;overflow:hidden;min-height:320px;

  /* layered dark-fantasy bg */
  background:
    /* top-center title glow */
    radial-gradient(ellipse 60% 35% at 50% 0%,  rgba(124,92,191,0.18) 0%, transparent 70%),
    /* player-side blue aura */
    radial-gradient(ellipse 55% 65% at 15% 100%, rgba(91,164,245,0.12) 0%, transparent 65%),
    /* enemy-side red aura */
    radial-gradient(ellipse 55% 65% at 85% 100%, rgba(240,107,107,0.12) 0%, transparent 65%),
    /* base dark surface */
    linear-gradient(175deg, #111128 0%, #0d0d1f 50%, #0a0a18 100%);
}

/* subtle animated mist layer */
.battle-stage::before{
  content:'';position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:
    radial-gradient(ellipse 80% 40% at 50% 110%, rgba(124,92,191,0.14) 0%, transparent 60%),
    radial-gradient(ellipse 40% 30% at 20% 80%,  rgba(91,164,245,0.07) 0%, transparent 55%),
    radial-gradient(ellipse 40% 30% at 80% 80%,  rgba(240,107,107,0.07) 0%, transparent 55%);
  animation:stage-pulse 5s ease-in-out infinite;
}
@keyframes stage-pulse{
  0%,100%{opacity:0.7} 50%{opacity:1}
}

/* runic border glow */
.battle-stage::after{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(124,92,191,0.22), inset 0 0 40px rgba(124,92,191,0.05);
}

/* ── COMBATANT ── */
.combatant{display:flex;flex-direction:column;align-items:center;gap:0.75rem;position:relative}

/* ── SPRITE WRAP — bigger ── */
.sprite-wrap{
  position:relative;width:130px;height:160px;
  display:flex;align-items:flex-end;justify-content:center;
}

/* shadow under sprite */
.sprite-shadow{
  position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);
  width:70px;height:10px;
  background:rgba(0,0,0,0.5);
  border-radius:50%;filter:blur(4px);
  transition:all 0.3s;
}

/* ── IDLE FLOAT ── */
.sprite{animation:idle-float 3s ease-in-out infinite;position:relative}
.combatant.enemy .sprite{animation:idle-float 3s ease-in-out infinite 0.7s}
@keyframes idle-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* shadow follows float */
@keyframes shadow-float{0%,100%{transform:translateX(-50%) scaleX(1);opacity:0.5}50%{transform:translateX(-50%) scaleX(0.75);opacity:0.25}}
.combatant .sprite-shadow{animation:shadow-float 3s ease-in-out infinite}
.combatant.enemy .sprite-shadow{animation:shadow-float 3s ease-in-out infinite 0.7s}

/* ── PLAYER SPRITE — CSS Mage (scaled up ~1.5×) ── */
.player-sprite{width:90px;height:130px;position:relative}
.player-sprite .head{
  width:38px;height:38px;background:#c4a882;border-radius:50%;
  position:absolute;top:20px;left:50%;transform:translateX(-50%);
  box-shadow:0 0 12px rgba(91,164,245,0.5);
}
.player-sprite .hat{
  width:0;height:0;
  border-left:22px solid transparent;border-right:22px solid transparent;
  border-bottom:36px solid #3a2a6e;
  position:absolute;top:-14px;left:50%;transform:translateX(-50%);
  filter:drop-shadow(0 0 6px rgba(124,92,191,0.4));
}
.player-sprite .hat::after{
  content:'';position:absolute;top:24px;left:-24px;
  width:48px;height:10px;background:#3a2a6e;border-radius:3px;
}
.player-sprite .eye-l,.player-sprite .eye-r{
  width:7px;height:7px;background:#5ba4f5;border-radius:50%;
  position:absolute;top:30px;box-shadow:0 0 6px #5ba4f5;
}
.player-sprite .eye-l{left:11px}.player-sprite .eye-r{right:11px}
/* blinking */
.player-sprite .eye-l,.player-sprite .eye-r{animation:blink 4s ease-in-out infinite 2s}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(0.1)}}

.player-sprite .robe{
  width:56px;height:62px;background:linear-gradient(180deg,#3a2a6e,#2a1a5e);
  border-radius:6px 6px 12px 12px;
  position:absolute;top:52px;left:50%;transform:translateX(-50%);
}
.player-sprite .robe::after{
  content:'★';position:absolute;top:12px;left:50%;transform:translateX(-50%);
  color:#e8b84b;font-size:14px;
  filter:drop-shadow(0 0 4px #e8b84b);
}
.player-sprite .staff{
  width:7px;height:85px;background:linear-gradient(180deg,#8b6fd4,#5b3fa0);
  border-radius:4px;position:absolute;top:12px;right:0;
}
.player-sprite .staff::before{
  content:'';position:absolute;top:-9px;left:50%;transform:translateX(-50%);
  width:18px;height:18px;background:#c084fc;border-radius:50%;
  box-shadow:0 0 14px #c084fc,0 0 28px rgba(192,132,252,0.5);
  animation:orb-pulse 2s ease-in-out infinite;
}
@keyframes orb-pulse{
  0%,100%{box-shadow:0 0 10px #c084fc,0 0 20px rgba(192,132,252,0.4)}
  50%{box-shadow:0 0 18px #c084fc,0 0 36px rgba(192,132,252,0.75),0 0 56px rgba(192,132,252,0.3)}
}
.player-sprite .legs{
  width:50px;height:22px;position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  display:flex;gap:8px;
}
.player-sprite .leg{width:20px;height:22px;background:#2a1a5e;border-radius:0 0 6px 6px}

/* leg idle sway */
.player-sprite .leg:first-child{animation:leg-sway 3s ease-in-out infinite}
.player-sprite .leg:last-child {animation:leg-sway 3s ease-in-out infinite 1.5s}
@keyframes leg-sway{0%,100%{transform:rotate(0deg)}50%{transform:rotate(3deg)}}

/* ── ENEMY SPRITE — Shadow Beast (scaled up ~1.5×) ── */
.enemy-sprite{width:100px;height:130px;position:relative}
.enemy-sprite .body{
  width:72px;height:72px;
  background:linear-gradient(135deg,#2a0a0a,#1a0505);
  border-radius:10px 10px 16px 16px;
  position:absolute;top:40px;left:50%;transform:translateX(-50%);
  box-shadow:0 0 24px rgba(240,107,107,0.35);
}
.enemy-sprite .body::after{
  content:'';position:absolute;inset:-5px;
  border-radius:13px 13px 18px 18px;
  background:transparent;border:1px solid rgba(240,107,107,0.2);
}
/* body aura pulse */
.enemy-sprite .body::before{
  content:'';position:absolute;inset:-10px;border-radius:18px;
  background:radial-gradient(circle,rgba(240,107,107,0.08),transparent 70%);
  animation:aura-pulse 2.5s ease-in-out infinite;
}
@keyframes aura-pulse{0%,100%{opacity:0.5;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}

.enemy-sprite .head{
  width:62px;height:50px;
  background:linear-gradient(135deg,#1a0505,#2a0a0a);
  border-radius:8px 8px 6px 6px;
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  box-shadow:0 0 16px rgba(240,107,107,0.3);
}
.enemy-sprite .horn-l,.enemy-sprite .horn-r{
  width:0;height:0;position:absolute;top:-14px;
  border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:20px solid #3a0a0a;
  filter:drop-shadow(0 0 4px rgba(240,107,107,0.4));
}
.enemy-sprite .horn-l{left:8px;transform:rotate(-15deg)}
.enemy-sprite .horn-r{right:8px;transform:rotate(15deg)}
.enemy-sprite .eye-l,.enemy-sprite .eye-r{
  width:12px;height:12px;background:#f06b6b;border-radius:50%;
  position:absolute;top:16px;
  box-shadow:0 0 10px #f06b6b,0 0 20px rgba(240,107,107,0.6);
  animation:eye-glow 2s ease-in-out infinite;
}
.enemy-sprite .eye-l{left:11px}.enemy-sprite .eye-r{right:11px}
@keyframes eye-glow{
  0%,100%{box-shadow:0 0 8px #f06b6b,0 0 16px rgba(240,107,107,0.5)}
  50%{box-shadow:0 0 16px #f06b6b,0 0 32px rgba(240,107,107,0.9),0 0 48px rgba(240,107,107,0.3)}
}
/* pupil slit */
.enemy-sprite .eye-l::after,.enemy-sprite .eye-r::after{
  content:'';position:absolute;inset:3px;background:#1a0505;border-radius:50%;
}
.enemy-sprite .claw-l,.enemy-sprite .claw-r{
  width:20px;height:38px;background:linear-gradient(180deg,#2a0a0a,#1a0505);
  border-radius:3px 3px 8px 8px;position:absolute;top:50px;
}
.enemy-sprite .claw-l{left:0}.enemy-sprite .claw-r{right:0}
.enemy-sprite .claw-l::after,.enemy-sprite .claw-r::after{
  content:'';position:absolute;bottom:-8px;left:3px;
  width:5px;height:10px;background:#3a0a0a;border-radius:0 0 4px 4px;
  box-shadow:7px 0 0 #3a0a0a;
}
/* claw idle wiggle */
.enemy-sprite .claw-l{animation:claw-wiggle 4s ease-in-out infinite}
.enemy-sprite .claw-r{animation:claw-wiggle 4s ease-in-out infinite 2s}
@keyframes claw-wiggle{0%,100%{transform:rotate(0deg)}50%{transform:rotate(5deg)}}

/* ── HP section ── */
.combatant-info{width:100%;display:flex;flex-direction:column;gap:0.4rem;align-items:center}
.combatant-name{font-family:'Cinzel',serif;font-size:0.9rem;font-weight:600;letter-spacing:0.06em}
.combatant.player .combatant-name{color:var(--player)}
.combatant.enemy  .combatant-name{color:var(--enemy)}
.hp-row{display:flex;align-items:center;gap:0.5rem;width:100%}
.combatant.enemy .hp-row{flex-direction:row-reverse}
.hp-num{font-size:1.05rem;font-weight:700;font-family:'Cinzel',serif;color:var(--text);min-width:60px;white-space:nowrap}
.combatant.enemy .hp-num{text-align:right}
.hp-track{flex:1;height:9px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--border)}
.hp-fill{height:100%;border-radius:99px;transition:width 0.6s cubic-bezier(.4,0,.2,1)}
.combatant.player .hp-fill{background:linear-gradient(90deg,#2563eb,var(--player))}
.combatant.enemy  .hp-fill{background:linear-gradient(90deg,var(--enemy),#fca5a5);margin-left:auto}

/* ── VS ── */
.vs-col{text-align:center}
.vs-text{
  font-family:'Cinzel',serif;font-size:1.3rem;color:var(--gold);display:block;
  animation:vs-pulse 3s ease-in-out infinite;
}
@keyframes vs-pulse{0%,100%{text-shadow:0 0 8px rgba(232,184,75,0.4)}50%{text-shadow:0 0 20px rgba(232,184,75,0.8)}}
.turn-text{font-size:0.72rem;color:var(--sub);display:block;margin-top:0.3rem}

/* ── ATTACK ANIMATIONS ── */
.combatant.player.attacking .sprite{animation:player-attack 0.55s ease forwards}
@keyframes player-attack{
  0%{transform:translateX(0) rotate(0deg)}
  35%{transform:translateX(80px) rotate(-8deg)}
  65%{transform:translateX(80px) rotate(-8deg)}
  100%{transform:translateX(0) rotate(0deg)}
}
.combatant.enemy.hit .sprite{animation:hit-shake 0.45s ease}
@keyframes hit-shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(14px) rotate(3deg)}
  40%{transform:translateX(-10px) rotate(-2deg)}
  60%{transform:translateX(8px) rotate(2deg)}
  80%{transform:translateX(-5px)}
}
.combatant.player.hit .sprite{animation:hit-shake 0.45s ease}
.combatant.enemy.attacking .sprite{animation:enemy-attack 0.55s ease forwards}
@keyframes enemy-attack{
  0%{transform:translateX(0) rotate(0deg)}
  35%{transform:translateX(-80px) rotate(8deg)}
  65%{transform:translateX(-80px) rotate(8deg)}
  100%{transform:translateX(0) rotate(0deg)}
}

/* flash-white on hit */
.combatant.player.flash .sprite,.combatant.enemy.flash .sprite{animation:flash-white 0.4s ease}
@keyframes flash-white{
  0%,100%{filter:none}
  25%{filter:brightness(4) saturate(0)}
  60%{filter:brightness(2) saturate(0)}
}

/* victory + defeat */
.combatant.player.victory .sprite{animation:victory-bounce 0.7s ease}
@keyframes victory-bounce{
  0%,100%{transform:translateY(0)}
  25%{transform:translateY(-28px) rotate(-5deg)}
  50%{transform:translateY(-14px) rotate(3deg)}
  75%{transform:translateY(-20px) rotate(-2deg)}
}
.combatant.enemy.defeated .sprite{animation:collapse 0.6s ease forwards}
@keyframes collapse{
  0%{transform:rotate(0) translateY(0) scale(1);opacity:1}
  60%{transform:rotate(20deg) translateY(10px) scale(0.9);opacity:0.6}
  100%{transform:rotate(35deg) translateY(28px) scale(0.8);opacity:0.1}
}

/* screen shake on big hit */
@keyframes screen-shake{
  0%,100%{transform:translate(0,0)}
  15%{transform:translate(-4px,2px)}
  30%{transform:translate(4px,-2px)}
  45%{transform:translate(-3px,3px)}
  60%{transform:translate(3px,-1px)}
  75%{transform:translate(-2px,2px)}
}
.battle-stage.shaking{animation:screen-shake 0.4s ease}

/* ── PROJECTILE ── */
#projectile{
  position:absolute;top:48%;left:25%;transform:translateY(-50%);
  width:18px;height:18px;border-radius:50%;
  background:radial-gradient(circle,#fff 20%,#c084fc 70%);
  box-shadow:0 0 16px #c084fc,0 0 32px rgba(192,132,252,0.7);
  display:none;pointer-events:none;z-index:10;
}
#projectile::after{
  content:'';position:absolute;top:50%;right:100%;transform:translateY(-50%);
  width:30px;height:4px;
  background:linear-gradient(90deg,transparent,rgba(192,132,252,0.6));
  border-radius:0 2px 2px 0;
}
#projectile.fire{display:block;animation:proj-fly 0.48s ease forwards}
@keyframes proj-fly{
  0%{left:26%;opacity:1;transform:translateY(-50%) scale(1)}
  80%{left:70%;opacity:0.9;transform:translateY(-50%) scale(1.2)}
  100%{left:72%;opacity:0;transform:translateY(-50%) scale(0.6)}
}

#enemy-slash{
  position:absolute;top:28%;left:55%;
  width:60px;height:60px;display:none;pointer-events:none;z-index:10;
}
#enemy-slash.fire{display:block;animation:slash-anim 0.42s ease forwards}
@keyframes slash-anim{
  0%{opacity:0;transform:rotate(-45deg) scale(0.4)}
  25%{opacity:1;transform:rotate(-45deg) scale(1.3)}
  100%{opacity:0;transform:rotate(-45deg) scale(1.6)}
}
#enemy-slash::before,#enemy-slash::after{
  content:'';position:absolute;background:var(--enemy);border-radius:3px;
}
#enemy-slash::before{width:4px;height:50px;top:5px;left:28px;transform:rotate(20deg)}
#enemy-slash::after{width:4px;height:38px;top:12px;left:38px;transform:rotate(20deg)}

/* ── PARTICLES ── */
.particle{
  position:absolute;border-radius:50%;pointer-events:none;z-index:15;
  animation:particle-burst 0.7s ease forwards;
}
@keyframes particle-burst{
  0%{opacity:1;transform:translate(0,0) scale(1)}
  100%{opacity:0;transform:var(--tx,translate(30px,-40px)) scale(0)}
}

/* ── DAMAGE NUMBER ── */
.dmg-num{
  position:absolute;font-family:'Cinzel',serif;font-weight:700;font-size:1.3rem;
  pointer-events:none;z-index:20;animation:dmg-float 1s ease forwards;
  text-shadow:0 2px 8px rgba(0,0,0,0.6);
}
@keyframes dmg-float{
  0%{opacity:1;transform:translateY(0) scale(0.8)}
  15%{transform:translateY(-10px) scale(1.2)}
  100%{opacity:0;transform:translateY(-64px) scale(1)}
}
.dmg-num.player-dmg{color:#ff8080;right:12%}
.dmg-num.enemy-dmg{color:#7ec8ff;left:12%}

/* ── STATUS TEXT (crit / miss) ── */
.status-text{
  position:absolute;font-family:'Cinzel',serif;font-weight:700;font-size:0.85rem;
  pointer-events:none;z-index:20;animation:status-float 1s ease forwards;
  letter-spacing:0.08em;
}
@keyframes status-float{
  0%{opacity:0;transform:translateY(0) scale(0.6)}
  20%{opacity:1;transform:translateY(-10px) scale(1.1)}
  100%{opacity:0;transform:translateY(-50px) scale(0.9)}
}

/* ── BOTTOM AREA — responsive grid ── */
.bottom-area{
  display:grid;
  grid-template-columns:1fr 340px;
  gap:1.1rem;
  align-items:start;
}
@media(max-width:900px){
  .bottom-area{grid-template-columns:1fr}
  .page{padding:1rem 1rem 2rem}
}

/* ── PANELS ── */
.panel{
  background:rgba(13,13,28,0.72);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(124,92,191,0.18);
  border-radius:12px;padding:1.1rem 1.25rem;
}
.panel-title{
  font-size:0.68rem;font-weight:600;text-transform:uppercase;letter-spacing:0.12em;
  color:var(--sub);padding-bottom:0.6rem;margin-bottom:0.8rem;
  border-bottom:1px solid rgba(124,92,191,0.15);
  display:flex;align-items:center;
}

/* ── LOG ── */
#combat-log{list-style:none;display:flex;flex-direction:column;gap:0.3rem;max-height:240px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
#combat-log li{font-size:0.85rem;padding:0.4rem 0.75rem;border-radius:6px;border-left:3px solid var(--border);background:var(--surface2);animation:slideIn 0.25s ease}
#combat-log li.log-attack{border-left-color:var(--player)}
#combat-log li.log-enemy{border-left-color:var(--enemy);color:#f5c0c0}
#combat-log li.log-win{border-left-color:var(--gold);color:var(--gold)}
#combat-log li.log-lose{border-left-color:var(--enemy);color:#f87171}
#combat-log li.log-info{border-left-color:var(--border);color:var(--sub)}
@keyframes slideIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}

/* ── ATTACK PANEL ── */
.attack-panel textarea{
  width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:7px;
  color:var(--text);padding:0.75rem 0.9rem;font-family:'Outfit',sans-serif;font-size:0.9rem;
  resize:none;outline:none;transition:border-color 0.2s;line-height:1.6;margin-bottom:0.8rem;
}
.attack-panel textarea:focus{border-color:var(--accent)}
.attack-panel textarea::placeholder{color:var(--sub)}
</style>
</head>
<body>

<nav>
  <a class="nav-brand" href="{% url 'combat:arena' %}">⚔ Lexical Arena</a>
  <div class="nav-links">
    <div class="nav-name-widget" title="Your name in battle">
      <!-- person/user icon -->
      <span class="nav-name-icon">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="8" cy="5" r="3" stroke="currentColor" stroke-width="1.5"/>
          <path d="M2 14c0-3.314 2.686-5 6-5s6 1.686 6 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </span>
      <input class="nav-name-input" type="text" id="player-name" value="Challenger" placeholder="Your name…" maxlength="24">
      <!-- dice icon -->
      <button class="nav-random-btn" id="random-name-btn" title="Random name">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="20" height="20" rx="4" stroke="currentColor" stroke-width="1.75"/>
          <circle cx="8"  cy="8"  r="1.4" fill="currentColor"/>
          <circle cx="16" cy="8"  r="1.4" fill="currentColor"/>
          <circle cx="8"  cy="16" r="1.4" fill="currentColor"/>
          <circle cx="16" cy="16" r="1.4" fill="currentColor"/>
          <circle cx="12" cy="12" r="1.4" fill="currentColor"/>
        </svg>
      </button>
    </div>
    <a class="nav-btn active" href="{% url 'combat:arena' %}">Battle</a>
    <a class="nav-btn" href="{% url 'combat:leaderboard_page' %}">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2l2.09 6.26H20l-5 3.64 1.91 5.84L12 14.27l-4.91 3.47L9 11.9 4 8.26h5.91z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>Leaderboard
    </a>
  </div>
</nav>

<div class="page">
  <div class="setup-bar">
    <div class="field">
      <label for="target-topic">Battle Topic</label>
      <input type="text" id="target-topic" value="{{ default_topic }}">
    </div>
    <button class="btn btn-ghost" id="reset-btn">↺ New Match</button>
  </div>

  <div class="battle-stage" id="battle-stage">
    <div id="projectile"></div>
    <div id="enemy-slash"></div>

    <!-- PLAYER -->
    <div class="combatant player" id="combatant-player">
      <div class="combatant-info">
        <span class="combatant-name" id="player-display-name">Challenger</span>
        <div class="hp-row">
          <span class="hp-num"><span id="player-hp">100</span>/100</span>
          <div class="hp-track"><div class="hp-fill" id="player-hp-bar" style="width:100%"></div></div>
        </div>
      </div>
      <div class="sprite-wrap">
        <div class="sprite">
          <div class="player-sprite">
            <div class="hat"></div>
            <div class="head"><div class="eye-l"></div><div class="eye-r"></div></div>
            <div class="robe"></div>
            <div class="staff"></div>
            <div class="legs"><div class="leg"></div><div class="leg"></div></div>
          </div>
        </div>
        <div class="sprite-shadow"></div>
      </div>
    </div>

    <!-- VS -->
    <div class="vs-col">
      <span class="vs-text">VS</span>
      <span class="turn-text">Turn <span id="turn-number">1</span></span>
    </div>

    <!-- ENEMY -->
    <div class="combatant enemy" id="combatant-enemy">
      <div class="combatant-info">
        <span class="combatant-name">The Lexicon</span>
        <div class="hp-row">
          <div class="hp-track"><div class="hp-fill" id="enemy-hp-bar" style="width:100%"></div></div>
          <span class="hp-num" style="text-align:right"><span id="enemy-hp">100</span>/100</span>
        </div>
      </div>
      <div class="sprite-wrap">
        <div class="sprite">
          <div class="enemy-sprite">
            <div class="horn-l"></div><div class="horn-r"></div>
            <div class="head"><div class="eye-l"></div><div class="eye-r"></div></div>
            <div class="body"></div>
            <div class="claw-l"></div><div class="claw-r"></div>
          </div>
        </div>
        <div class="sprite-shadow"></div>
      </div>
    </div>
  </div>

  <div class="bottom-area">
    <div class="panel">
      <div class="panel-title">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-right:0.4em;vertical-align:-1px;flex-shrink:0">
          <path d="M13 2L4.5 13.5H12L11 22L19.5 10.5H12L13 2Z" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/>
        </svg>Combat Log
      </div>
      <ul id="combat-log">
        <li class="log-info">The battle awaits — craft your first attack.</li>
      </ul>
    </div>
    <div class="panel attack-panel">
      <div class="panel-title">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-right:0.4em;vertical-align:-1px;flex-shrink:0">
          <path d="M12 3l1.5 4.5H18l-3.75 2.73 1.43 4.37L12 11.9l-3.68 2.7 1.43-4.37L6 7.5h4.5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M5 20h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>Your Attack
      </div>
      <form id="attack-form">
        {% csrf_token %}
        <textarea id="attack-text" rows="6" placeholder="Type a phrase aligned with the battle topic…"></textarea>
        <button type="submit" class="btn btn-primary" id="attack-btn">⚔ Launch Attack</button>
      </form>
    </div>
  </div>
</div>

<script>
let playerHp = 100, enemyHp = 100, turnNumber = 1;
const form        = document.getElementById("attack-form");
const attackInput = document.getElementById("attack-text");
const attackBtn   = document.getElementById("attack-btn");
const resetBtn    = document.getElementById("reset-btn");
const combatLog   = document.getElementById("combat-log");
const playerNameInput = document.getElementById("player-name");
const stage       = document.getElementById("battle-stage");

/* ─── Random Name ─── */
const RANDOM_NAMES = [
  "Arcane Sage","Shadow Reaper","Word Weaver","Lexicon King","Rune Caller",
  "Void Scribe","Glyph Hunter","Spell Binder","Echo Knight","Myth Forger",
  "Storm Cipher","Prism Hawk","Dark Quill","Soul Lexer","Neon Oracle",
  "Iron Verse","Ash Chanter","Dusk Writer","Flame Codex","Frost Sigil"
];
document.getElementById("random-name-btn").addEventListener("click", () => {
  const name = RANDOM_NAMES[Math.floor(Math.random() * RANDOM_NAMES.length)];
  playerNameInput.value = name;
  updateUI();
});

function getCsrf() { return document.querySelector("[name=csrfmiddlewaretoken]").value; }

function log(msg, type = "info") {
  const li = document.createElement("li");
  li.textContent = msg;
  li.className = `log-${type}`;
  combatLog.prepend(li);
}

function updateUI() {
  document.getElementById("player-hp").textContent = playerHp;
  document.getElementById("enemy-hp").textContent  = enemyHp;
  document.getElementById("turn-number").textContent = turnNumber;
  document.getElementById("player-hp-bar").style.width = playerHp + "%";
  document.getElementById("enemy-hp-bar").style.width  = enemyHp + "%";
  document.getElementById("player-display-name").textContent = playerNameInput.value || "Challenger";
}

/* ─── Damage Number ─── */
function spawnDmgNum(amount, cls) {
  const el = document.createElement("div");
  el.className = `dmg-num ${cls}`;
  el.textContent = `-${amount}`;
  el.style.top = "28%";
  stage.appendChild(el);
  el.addEventListener("animationend", () => el.remove());
}

/* ─── Particles burst ─── */
function spawnParticles(x, y, color, count = 10) {
  for (let i = 0; i < count; i++) {
    const p = document.createElement("div");
    p.className = "particle";
    const angle = (Math.random() * 360) * (Math.PI / 180);
    const dist  = 30 + Math.random() * 60;
    const tx = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px)`;
    p.style.cssText = `
      left:${x}px;top:${y}px;
      width:${4 + Math.random() * 6}px;height:${4 + Math.random() * 6}px;
      background:${color};
      --tx:${tx};
      animation-duration:${0.5 + Math.random() * 0.4}s;
      animation-delay:${Math.random() * 0.1}s;
    `;
    stage.appendChild(p);
    p.addEventListener("animationend", () => p.remove());
  }
}

/* ─── Screen Shake ─── */
function shakeStage() {
  stage.classList.remove("shaking");
  void stage.offsetWidth; // reflow to restart
  stage.classList.add("shaking");
  stage.addEventListener("animationend", () => stage.classList.remove("shaking"), { once: true });
}

/* ─── Add / remove class helper ─── */
function triggerClass(el, cls, duration) {
  el.classList.add(cls);
  setTimeout(() => el.classList.remove(cls), duration);
}

/* ─── Player Attack Sequence ─── */
async function playPlayerAttack(damage) {
  const player = document.getElementById("combatant-player");
  const enemy  = document.getElementById("combatant-enemy");
  const proj   = document.getElementById("projectile");
  const enemyRect = enemy.getBoundingClientRect();
  const stageRect = stage.getBoundingClientRect();

  triggerClass(player, "attacking", 550);
  await new Promise(r => setTimeout(r, 220));

  proj.classList.add("fire");
  await new Promise(r => setTimeout(r, 480));
  proj.classList.remove("fire");

  // impact
  shakeStage();
  triggerClass(enemy, "hit", 450);
  triggerClass(enemy, "flash", 400);
  spawnDmgNum(damage, "enemy-dmg");

  // particles at enemy centre
  const px = enemyRect.left - stageRect.left + enemyRect.width / 2;
  const py = enemyRect.top  - stageRect.top  + enemyRect.height / 2;
  spawnParticles(px, py, "#c084fc", 12);
}

/* ─── Enemy Attack Sequence ─── */
async function playEnemyAttack(damage) {
  const player = document.getElementById("combatant-player");
  const enemy  = document.getElementById("combatant-enemy");
  const slash  = document.getElementById("enemy-slash");
  const playerRect = player.getBoundingClientRect();
  const stageRect  = stage.getBoundingClientRect();

  triggerClass(enemy, "attacking", 550);
  await new Promise(r => setTimeout(r, 220));

  slash.classList.add("fire");
  await new Promise(r => setTimeout(r, 420));
  slash.classList.remove("fire");

  shakeStage();
  triggerClass(player, "hit", 450);
  triggerClass(player, "flash", 400);
  spawnDmgNum(damage, "player-dmg");

  const px = playerRect.left - stageRect.left + playerRect.width / 2;
  const py = playerRect.top  - stageRect.top  + playerRect.height / 2;
  spawnParticles(px, py, "#f06b6b", 12);
}

/* ─── Reset ─── */
resetBtn.addEventListener("click", () => {
  playerHp = enemyHp = 100; turnNumber = 1;
  attackBtn.disabled = false;
  combatLog.innerHTML = "";
  document.getElementById("combatant-enemy").classList.remove("defeated");
  document.getElementById("combatant-player").classList.remove("victory");
  updateUI();
  log("A new battle begins…", "info");
});

/* ─── Attack Submit ─── */
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = attackInput.value.trim();
  if (!text) return;
  attackBtn.disabled = true;

  const res = await fetch("{% url 'combat:attack' %}", {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-CSRFToken": getCsrf() },
    body: JSON.stringify({
      player_name:  playerNameInput.value,
      target_topic: document.getElementById("target-topic").value,
      attack_text:  text,
      turn_number:  turnNumber,
      player_hp:    playerHp,
      enemy_hp:     enemyHp,
    }),
  });

  const data = await res.json();
  if (!res.ok) { log(`Error: ${data.error || "Request failed."}`, "lose"); attackBtn.disabled = false; return; }

  await playPlayerAttack(data.attack_result.damage);
  playerHp = data.player_hp;
  enemyHp  = data.enemy_hp;

  const bonus = data.attack_result.topic_bonus ? " · +topic bonus" : "";
  log(`Turn ${turnNumber} — Dealt ${data.attack_result.damage} dmg (${data.attack_result.unique_word_count} unique words${bonus})`, "attack");

  if (data.enemy_action) {
    await new Promise(r => setTimeout(r, 350));
    await playEnemyAttack(data.enemy_action.damage);
    log(`The Lexicon strikes back for ${data.enemy_action.damage} dmg — "${data.enemy_action.enemy_text}"`, "enemy");
  }

  updateUI();

  if (data.match_status === "won") {
    log("⚔ Victory! The Lexicon has been vanquished!", "win");
    document.getElementById("combatant-enemy").classList.add("defeated");
    document.getElementById("combatant-player").classList.add("victory");
  } else if (data.match_status === "lost") {
    log("💀 Defeat! Your words were not enough…", "lose");
  } else {
    turnNumber++;
    attackBtn.disabled = false;
  }

  attackInput.value = "";
});
</script>
</body>
</html>
